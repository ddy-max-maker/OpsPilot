<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" width="1400" height="1060" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1400" height="1060" fill="#ffffff"/>

  <text x="36" y="40" font-size="20" font-weight="700" fill="#0f172a">审批与受控执行时序（C 路线：提案 → 四眼审批 → 执行门禁 → 恢复验证）</text>
  <text x="36" y="64" font-size="12.5" fill="#64748b">红色＝被拒绝的路径，蓝色虚线＝返回，灰色虚线＝仅在隔离演示 Daemon 上显式开启后才存在。默认配置下真实写操作不发生，外部效果为零。</text>

  <!-- 生命线头 -->
  <g>
    <rect x="40" y="92" width="120" height="54" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="100" y="116" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Agent 报告</text>
    <text x="100" y="134" font-size="10.5" fill="#5b21b6" text-anchor="middle">根因＋证据</text>

    <rect x="190" y="92" width="130" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="255" y="116" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">提案人 operator</text>
    <text x="255" y="134" font-size="10.5" fill="#64748b" text-anchor="middle">发起 / 执行</text>

    <rect x="350" y="92" width="130" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="415" y="116" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">审批人 approver</text>
    <text x="415" y="134" font-size="10.5" fill="#64748b" text-anchor="middle">必须是第二个人</text>

    <rect x="520" y="92" width="140" height="54" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="590" y="116" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">ops-api</text>
    <text x="590" y="134" font-size="10.5" fill="#1e40af" text-anchor="middle">策略 / 审批 / Outbox</text>

    <rect x="700" y="92" width="150" height="54" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="775" y="116" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">PostgreSQL</text>
    <text x="775" y="134" font-size="10.5" fill="#115e59" text-anchor="middle">语义字段唯一权威</text>

    <rect x="890" y="92" width="130" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="955" y="116" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">RabbitMQ</text>
    <text x="955" y="134" font-size="10.5" fill="#64748b" text-anchor="middle">至少一次</text>

    <rect x="1060" y="92" width="150" height="54" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="1135" y="116" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">ops-action</text>
    <text x="1135" y="134" font-size="10.5" fill="#991b1b" text-anchor="middle">唯一有副作用</text>

    <rect x="1250" y="92" width="130" height="54" rx="8" fill="#fffbeb" stroke="#b45309"/>
    <text x="1315" y="116" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">目标环境</text>
    <text x="1315" y="134" font-size="10.5" fill="#92400e" text-anchor="middle">sandbox</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5">
    <line x1="100" y1="146" x2="100" y2="1000"/>
    <line x1="255" y1="146" x2="255" y2="1000"/>
    <line x1="415" y1="146" x2="415" y2="1000"/>
    <line x1="590" y1="146" x2="590" y2="1000"/>
    <line x1="775" y1="146" x2="775" y2="1000"/>
    <line x1="955" y1="146" x2="955" y2="1000"/>
    <line x1="1135" y1="146" x2="1135" y2="1000"/>
    <line x1="1315" y1="146" x2="1315" y2="1000"/>
  </g>

  <!-- 阶段 -->
  <text x="36" y="196" font-size="10.5" font-weight="700" fill="#94a3b8">① 提案</text>
  <text x="36" y="360" font-size="10.5" font-weight="700" fill="#94a3b8">② 预检</text>
  <text x="36" y="480" font-size="10.5" font-weight="700" fill="#94a3b8">③ 四眼</text>
  <text x="36" y="640" font-size="10.5" font-weight="700" fill="#94a3b8">④ 执行</text>
  <text x="36" y="890" font-size="10.5" font-weight="700" fill="#94a3b8">⑤ 验证</text>

  <!-- 实线 -->
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#a)">
    <line x1="100" y1="206" x2="182" y2="206"/>
    <line x1="255" y1="246" x2="583" y2="246"/>
    <line x1="590" y1="286" x2="768" y2="286"/>
    <line x1="255" y1="366" x2="583" y2="366"/>
    <line x1="590" y1="406" x2="768" y2="406"/>
    <line x1="415" y1="566" x2="583" y2="566"/>
    <line x1="590" y1="606" x2="768" y2="606"/>
    <line x1="255" y1="646" x2="583" y2="646"/>
    <line x1="590" y1="686" x2="948" y2="686"/>
    <line x1="955" y1="726" x2="1128" y2="726"/>
    <line x1="1135" y1="766" x2="782" y2="766"/>
    <line x1="1135" y1="856" x2="782" y2="856"/>
    <line x1="255" y1="896" x2="583" y2="896"/>
  </g>

  <!-- 拒绝（红实线 + 红虚线） -->
  <g stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="255" y1="486" x2="583" y2="486"/>
    <line x1="1135" y1="806" x2="1202" y2="806"/>
  </g>
  <line x1="1202" y1="806" x2="1202" y2="836" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="1202" y1="836" x2="1142" y2="836" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 返回（蓝虚线） -->
  <g stroke="#0369a1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ad)">
    <line x1="583" y1="326" x2="262" y2="326"/>
    <line x1="583" y1="446" x2="262" y2="446"/>
    <line x1="583" y1="526" x2="262" y2="526"/>
    <line x1="583" y1="936" x2="262" y2="936"/>
  </g>

  <!-- 仅启用后才存在（灰虚线） -->
  <path d="M 1135 886 L 1308 886" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ag)"/>

  <!-- 文本 -->
  <g font-size="11.5" fill="#0f172a">
    <text x="106" y="200">1. 报告给出根因与证据</text>
    <text x="262" y="240">2. POST /proposals（Idempotency-Key ＋ 参数快照）</text>
    <text x="596" y="280">3. 策略校验（RBAC/范围/风险级/环境）→ parameter_hash</text>
    <text x="262" y="320" fill="#0369a1">4. 201 pending_approval</text>
    <text x="262" y="360">5. POST /dry-run</text>
    <text x="596" y="400">6. 七项只读前置检查（无副作用）</text>
    <text x="262" y="440" fill="#0369a1">7. checks：全部 PASS 才可能执行</text>
    <text x="262" y="480" fill="#b91c1c">8. 发起人自己审批</text>
    <text x="262" y="520" fill="#b91c1c">9. 403 FORBIDDEN（发起人 ≠ 审批人）</text>
    <text x="421" y="560">10. POST /approve</text>
    <text x="596" y="600">11. approval 落库（含有效期）→ approved</text>
    <text x="262" y="640">12. POST /execute</text>
    <text x="596" y="680">13. 校验未过期 ＋ 哈希一致 → Outbox 写 execute</text>
    <text x="962" y="720">14. 投递 execute 意图</text>
    <text x="782" y="760">15. 全链导上下文 ＋ 哈希三方比对 ＋ 幂等账本</text>
    <text x="1150" y="800" fill="#b91c1c">16. 门禁拒绝</text>
    <text x="782" y="850">17. execution=pre_check_failed ＋ reason</text>
    <text x="262" y="890">18. GET /proposals/{id}</text>
    <text x="262" y="930" fill="#0369a1">19. 终态 execution_failed ＋ 执行记录 reason</text>
  </g>

  <text x="1148" y="908" font-size="10.5" fill="#94a3b8">仅在隔离演示 Daemon 上显式开启后才存在：</text>
  <text x="1148" y="924" font-size="10.5" fill="#94a3b8">受控重启 → 观察窗口 → verified / failed</text>

  <rect x="36" y="972" width="720" height="52" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="52" y="992" font-size="11" fill="#991b1b">默认门禁：ACTION_EXECUTION_ENABLED=false ＋ ACTION_ISOLATED_DAEMON_ACK=false</text>
  <text x="52" y="1012" font-size="11" fill="#991b1b">→ 执行器在 fail_execution_precheck 直接返回拒绝，零容器写操作，结果仍结构化入账</text>

  <rect x="776" y="972" width="590" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="792" y="992" font-size="11" fill="#475569">审批通过 ≠ 会执行 ≠ 会恢复。</text>
  <text x="792" y="1012" font-size="11" fill="#475569">approval / execution / verification 三段独立记录，后一段失败不能被前一段的成功掩盖。</text>
</svg>
