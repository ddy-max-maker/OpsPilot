<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="1300" height="880" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1300" height="880" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#0f172a">OpsPilot Next · 总体架构</text>
  <text x="40" y="68" font-size="12.5" fill="#64748b">同仓库三入口（api / worker / action）按进程隔离故障域与凭据；业务状态权威是 PostgreSQL，不是 Agent 的记忆。</text>

  <text x="40" y="104" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.2">接入 · 调用方</text>
  <text x="420" y="104" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.2">应用进程（modular monolith + 两个独立消费者）</text>
  <text x="910" y="104" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.2">基础设施 · 目标环境</text>

  <!-- 接入层 -->
  <rect x="40" y="116" width="300" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="146" font-size="14.5" font-weight="700" fill="#0f172a">Vue 3 + TS 控制台</text>
  <text x="60" y="168" font-size="12" fill="#475569">五导航域 · SSE 断线重连（Last-Event-ID）</text>
  <text x="60" y="188" font-size="12" fill="#475569">nginx 托管 dist，/api 反代到 api:8000</text>

  <rect x="40" y="244" width="300" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="272" font-size="14.5" font-weight="700" fill="#0f172a">外部告警源</text>
  <text x="60" y="294" font-size="12" fill="#475569">HMAC-SHA256 验签 + 时间戳 ±300s</text>
  <text x="60" y="314" font-size="12" fill="#475569">delivery_id 去重复投递</text>

  <rect x="40" y="364" width="300" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="392" font-size="14.5" font-weight="700" fill="#0f172a">运维 / 演示脚本</text>
  <text x="60" y="414" font-size="12" fill="#475569">scripts/demo_routes.py（纯标准库）</text>
  <text x="60" y="434" font-size="12" fill="#475569">bootstrap_demo.sh / make</text>

  <!-- 应用层 -->
  <rect x="420" y="116" width="380" height="196" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="442" y="144" font-size="15" font-weight="700" fill="#1d4ed8">ops-api（uvicorn · FastAPI）</text>
  <text x="442" y="166" font-size="11.5" fill="#1e40af">认证 / RBAC / 资产范围 · 幂等键 · 事务边界</text>
  <text x="442" y="186" font-size="11.5" fill="#1e40af">事件状态机 · 资产 · 审计 · 集成/能力注册</text>
  <text x="442" y="206" font-size="11.5" fill="#1e40af">知识生命周期（复核/发布）· 提案/审批/策略</text>
  <text x="442" y="226" font-size="11.5" fill="#1e40af">run 状态权威 + SSE（从 run_events 重放）</text>
  <text x="442" y="246" font-size="11.5" fill="#1e40af">写入 run.model_config_snapshot（快照源）</text>
  <text x="442" y="272" font-size="11.5" fill="#64748b">无 Agent 依赖 · 无写凭据 · 不进 docker.sock</text>
  <rect x="442" y="282" width="132" height="18" rx="9" fill="#dbeafe"/>
  <text x="452" y="295" font-size="10.5" fill="#1d4ed8">Outbox 同事务写入</text>

  <rect x="420" y="336" width="380" height="196" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="442" y="364" font-size="15" font-weight="700" fill="#6d28d9">ops-worker（Agent 运行时）</text>
  <text x="442" y="386" font-size="11.5" fill="#5b21b6">DeepAgents 主 Agent ＋ LangGraph 图执行</text>
  <text x="442" y="406" font-size="11.5" fill="#5b21b6">checkpoint 独立 schema，thread_id = run_id</text>
  <text x="442" y="426" font-size="11.5" fill="#5b21b6">预算/迭代/deadline/取消：super-step 之间强制</text>
  <text x="442" y="446" font-size="11.5" fill="#5b21b6">Tool Gateway ＝ 进程内强制层（非网络服务）</text>
  <text x="442" y="466" font-size="11.5" fill="#5b21b6">工具 → 连接器（HTTP/Redis/Docker/Prom/OTel）</text>
  <text x="442" y="492" font-size="11.5" fill="#64748b">不挂载 docker.sock · 无任何写凭据</text>
  <rect x="442" y="502" width="152" height="18" rx="9" fill="#ede9fe"/>
  <text x="452" y="515" font-size="10.5" fill="#6d28d9">证据脱敏 + 注入标记</text>

  <rect x="420" y="556" width="380" height="152" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="442" y="584" font-size="15" font-weight="700" fill="#b91c1c">ops-action（唯一有副作用的进程）</text>
  <text x="442" y="606" font-size="11.5" fill="#991b1b">消息只是「该执行了」的通知，语义字段全从 DB 导</text>
  <text x="442" y="626" font-size="11.5" fill="#991b1b">参数哈希三方比对（Proposal/Approval/重算）</text>
  <text x="442" y="646" font-size="11.5" fill="#991b1b">allowlist R1 动作 + 幂等账本（零重复提交）</text>
  <text x="442" y="666" font-size="11.5" fill="#991b1b">恢复验证：完整观察窗口，不误报成功</text>
  <text x="442" y="692" font-size="11.5" fill="#64748b">ACTION_EXECUTION_ENABLED 默认 false</text>

  <!-- 基础设施 -->
  <rect x="910" y="116" width="350" height="170" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
  <text x="932" y="144" font-size="15" font-weight="700" fill="#0f766e">PostgreSQL 16 + pgvector</text>
  <text x="932" y="166" font-size="11.5" fill="#115e59">业务库（事件 / run / 证据 / 提案 / 审计）</text>
  <text x="932" y="186" font-size="11.5" fill="#115e59">知识库（文档 / 版本 / 向量 / Runbook）</text>
  <text x="932" y="206" font-size="11.5" fill="#115e59">langgraph schema（checkpoint，独立）</text>
  <text x="932" y="226" font-size="11.5" fill="#115e59">action_idempotency（幂等账本）</text>
  <text x="932" y="254" font-size="11.5" fill="#64748b" font-weight="700">业务状态的唯一权威</text>
  <text x="932" y="274" font-size="11.5" fill="#64748b">checkpoint 回答不了「事件现在什么状态」</text>

  <rect x="910" y="312" width="350" height="112" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="932" y="340" font-size="14.5" font-weight="700" fill="#0f766e">RabbitMQ</text>
  <text x="932" y="362" font-size="11.5" fill="#115e59">Outbox → 至少一次投递 → 手动 ACK</text>
  <text x="932" y="382" font-size="11.5" fill="#115e59">重复投递由认领状态 + 幂等键/账本吸收</text>
  <text x="932" y="404" font-size="11.5" fill="#64748b">worker 与 action 分属不同队列</text>

  <rect x="910" y="450" width="350" height="112" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="932" y="478" font-size="14.5" font-weight="700" fill="#0f766e">docker-ro-proxy</text>
  <text x="932" y="500" font-size="11.5" fill="#115e59">Docker API 方法 + 路径白名单，只放行只读端点</text>
  <text x="932" y="520" font-size="11.5" fill="#115e59">拒绝一切 POST / DELETE / EXEC</text>
  <text x="932" y="542" font-size="11.5" fill="#64748b">只读挂载 socket ≠ 只读权限（ADR-11）</text>

  <rect x="910" y="588" width="350" height="152" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
  <text x="932" y="616" font-size="14.5" font-weight="700" fill="#b45309">演示 / 目标环境（sandbox）</text>
  <text x="932" y="638" font-size="11.5" fill="#92400e">demo-redis · demo-app · demo-gateway</text>
  <text x="932" y="658" font-size="11.5" fill="#92400e">demo-java（跨语言）· demo-mysql</text>
  <text x="932" y="678" font-size="11.5" fill="#92400e">Prometheus · Jaeger（可观测源）</text>
  <text x="932" y="702" font-size="11.5" fill="#64748b">容器名统一前缀 opspilot-demo-</text>
  <text x="932" y="722" font-size="11.5" fill="#64748b">白名单环境仅 sandbox / staging</text>

  <!-- 连线 -->
  <line x1="340" y1="168" x2="414" y2="168" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="346" y="160" font-size="11" fill="#475569">HTTPS</text>

  <path d="M 340 286 L 378 286 L 378 240 L 414 240" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="342" y="278" font-size="11" fill="#475569">Webhook</text>

  <path d="M 340 404 L 396 404 L 396 272 L 414 272" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="342" y="396" font-size="11" fill="#475569">REST</text>

  <line x1="800" y1="168" x2="904" y2="168" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="808" y="160" font-size="11" fill="#115e59">权威状态</text>

  <path d="M 800 226 L 872 226 L 872 352 L 904 352" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="806" y="300" font-size="11" fill="#475569">Outbox</text>

  <line x1="904" y1="392" x2="806" y2="392" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="826" y="384" font-size="11" fill="#475569">投递</text>

  <path d="M 910 396 L 882 396 L 882 604 L 806 604" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="890" y="446" font-size="11" fill="#b91c1c">execute 意图</text>

  <path d="M 800 470 L 880 470 L 880 502 L 904 502" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowViolet)"/>
  <text x="812" y="462" font-size="11" fill="#6d28d9">只读 Docker</text>

  <line x1="1085" y1="562" x2="1085" y2="582" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M 800 650 L 876 650 L 876 664 L 904 664" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="806" y="680" font-size="11" fill="#b91c1c">受控写（默认关闭）</text>

  <!-- 底部三条红线 -->
  <rect x="40" y="766" width="1220" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="62" y="790" font-size="12.5" font-weight="700" fill="#0f172a">三条不可越过的边界</text>
  <text x="62" y="812" font-size="11.5" fill="#475569">① 业务状态只认 PostgreSQL：checkpoint 只服务图执行恢复，Agent 的记忆不是事实来源。</text>
  <text x="62" y="832" font-size="11.5" fill="#475569">② Worker 不持有写凭据、不挂载 docker.sock；Docker 诊断一律经只读代理转发。</text>
  <text x="62" y="852" font-size="11.5" fill="#475569">③ 只有 ops-action 产生外部副作用，其语义字段只从数据库读——篡改 MQ 消息改变不了执行目标。</text>
</svg>
