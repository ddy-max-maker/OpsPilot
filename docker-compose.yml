services:
  postgres:
    # D4：pgvector 官方镜像（PostgreSQL 16 + vector 扩展）
    image: pgvector/pgvector:pg16
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opspilot-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@postgres:5432/opspilot
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (copy .env.example to .env)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      WEBHOOK_ALERTS_SECRET: ${WEBHOOK_ALERTS_SECRET:?WEBHOOK_ALERTS_SECRET is required (copy .env.example to .env)}
      WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: ${WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
      # D3：连通性测试探针需要（MySQL 只读诊断实例）
      D3_MYSQL_RO_PASSWORD: ${D3_MYSQL_RO_PASSWORD:-}
      # D4：RAG 模式与 Embedding（知识检索 API 侧使用）
      RAG_MODE: ${RAG_MODE:-off}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local_e5}
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn entrypoints.api:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: opspilot-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  # ---- D2：Agent Worker（独立进程；不挂载 docker.sock，ADR-11）----
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opspilot-worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@postgres:5432/opspilot
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WEBHOOK_ALERTS_SECRET: ${WEBHOOK_ALERTS_SECRET:?WEBHOOK_ALERTS_SECRET is required}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-fake}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-fake-diagnoser}
      AGENT_API_KEY_ENV: ${AGENT_API_KEY_ENV:-}
      # OpenAI 兼容自定义 API 地址（deepseek 缺省官方，无需提供）
      AGENT_API_BASE: ${AGENT_API_BASE:-}
      # 真实模型 API Key 透传（AGENT_API_KEY_ENV 指向的变量名；本地 .env 提供，不入 Git）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # D3：MySQL 只读诊断账号密码（连接器经 password_env 间接引用）
      D3_MYSQL_RO_PASSWORD: ${D3_MYSQL_RO_PASSWORD:-}
      AGENT_PROMPT_VERSION: ${AGENT_PROMPT_VERSION:-d4-v1}
      # D4：RAG 模式与 Embedding（Agent 知识工具按 RAG_MODE 决定可用性）
      RAG_MODE: ${RAG_MODE:-off}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local_e5}
      BUDGET_MAX_TOOL_CALLS: ${BUDGET_MAX_TOOL_CALLS:-24}
      BUDGET_DEADLINE_SECONDS: ${BUDGET_DEADLINE_SECONDS:-900}
      WORKER_LEASE_TTL_SECONDS: ${WORKER_LEASE_TTL_SECONDS:-60}
    command: sh -c "alembic upgrade head && python -m entrypoints.worker"
    restart: unless-stopped

  # ---- D2：Docker 只读代理（唯一挂载 docker.sock 的组件，ADR-11）----
  docker-ro-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opspilot-docker-ro-proxy
    command: sh -c "uvicorn roproxy.app:app --host 0.0.0.0 --port 8800"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8800/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # ---- D2 演示环境（profile: demo；不影响 OpsPilot 自身服务）----
  demo-app:
    image: python:3.12-slim
    container_name: opspilot-demo-app
    profiles: ["demo"]
    volumes:
      - ./demo/demo_app.py:/srv/demo_app.py:ro
    command: python /srv/demo_app.py
    environment:
      DEMO_REDIS_HOST: demo-redis
      DEMO_REDIS_PORT: "6379"
    restart: unless-stopped

  demo-redis:
    image: redis:7-alpine
    container_name: opspilot-demo-redis
    profiles: ["demo"]
    restart: unless-stopped

  demo-gateway:
    image: nginx:1.27-alpine
    container_name: opspilot-demo-gateway
    profiles: ["demo"]
    depends_on:
      - demo-app
    volumes:
      - ./demo/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    restart: unless-stopped

  # S2 注入用：受内存限制的压力容器（独立 profile，仅注入脚本启动）
  demo-crasher:
    image: python:3.12-slim
    container_name: opspilot-demo-crasher
    profiles: ["demo-fault"]
    volumes:
      - ./demo/crasher.py:/srv/crasher.py:ro
    command: python /srv/crasher.py
    mem_limit: 32m
    restart: "no"

  # ---- D3：跨语言演示（Java Spring Boot）+ 真实可观测性后端 + MySQL ----
  demo-java:
    build:
      context: ./demo-java
      dockerfile: Dockerfile
    container_name: opspilot-demo-java
    profiles: ["demo"]
    depends_on:
      - demo-app
      - jaeger
    environment:
      SERVICE_NAME: java-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8082:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: opspilot-prometheus
    profiles: ["demo"]
    volumes:
      - ./demo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: opspilot-jaeger
    profiles: ["demo"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped

  demo-mysql:
    image: mysql:8.4
    container_name: opspilot-demo-mysql
    profiles: ["demo"]
    environment:
      MYSQL_ROOT_PASSWORD: ${D3_MYSQL_ROOT_PASSWORD:-DemoRoot2026!}
      MYSQL_DATABASE: orders_demo
    volumes:
      - ./demo/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
