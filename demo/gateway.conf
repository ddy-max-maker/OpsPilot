server {
    listen 80;
    server_name _;

    # S4：上游为 demo-app；注入 = 停止 demo-app 容器 → 本网关返回真实 5xx
    # （实测 504 Gateway Timeout：容器停止后 nginx 缓存的 upstream IP 连接超时；
    #   若 nginx 重新解析 DNS 得到 NXDOMAIN 则为 502——验收断言按实际观测记录）
    location = /health {
        proxy_pass http://demo-app:8080/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://demo-app:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
