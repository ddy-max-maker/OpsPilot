server {
    listen 80;
    server_name _;

    # S4：上游为 demo-app；注入 = 停止 demo-app 容器 → 本网关返回真实 502
    location = /health {
        proxy_pass http://demo-app:8080/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://demo-app:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
