# OpsPilot Next D3 演示：Prometheus 真实抓取（Java Micrometer + Python stdlib exposition）
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: java-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["demo-java:8080"]

  - job_name: demo-app
    metrics_path: /metrics
    static_configs:
      - targets: ["demo-app:8080"]

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
