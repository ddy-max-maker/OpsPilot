name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & Type Check (Ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy type check
        run: uv run mypy app

  test:
    name: Tests (real PostgreSQL + Alembic drill)
    runs-on: ubuntu-latest
    services:
      postgres:
        # D4：pgvector 官方镜像（与 docker-compose 一致）
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        # D5：Outbox 投递与消息重投测试（确定性集成测试不操作真实容器）
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: opspilot
          RABBITMQ_DEFAULT_PASS: opspilot
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s

    env:
      # CI 专用配置，不依赖本地 .env / .env.local / 开发机私人配置
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      WEBHOOK_ALERTS_SECRET: ci-only-webhook-secret-0123456789abcdef
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: AdminBoot123!
      # D2：CI 一律使用确定性 Fake Chat Model（不依赖私人 API Key）；
      # 真实模型验收测试（test_real_model.py）因无凭据自动跳过，见测试内 skipif 标记
      AGENT_PROVIDER: fake
      AGENT_MODEL_NAME: fake-diagnoser
      # D6：内置 fake 模型需显式开启（生产默认关闭，避免静默降级为假模型）
      AGENT_FAKE_PROVIDER_ENABLED: "true"
      # D4：CI 使用确定性 Fake Embedding + RAG off（真实 e5 验收单独执行，不进 CI）
      EMBEDDING_PROVIDER: fake
      RAG_MODE: off
      # D5：CI RabbitMQ（Outbox/重投测试使用）
      RABBITMQ_URL: amqp://opspilot:opspilot@localhost:5672/%2F

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Alembic migration drill (empty database -> head)
        env:
          DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot
        run: uv run alembic upgrade head

      - name: Verify migrated schema objects exist
        env:
          PGPASSWORD: opspilot
        run: |
          psql -h localhost -U opspilot -d opspilot -c "\dt" | tee /tmp/tables.txt
          grep -q "incidents" /tmp/tables.txt
          grep -q "alerts" /tmp/tables.txt
          grep -q "api_idempotency_keys" /tmp/tables.txt
          grep -q "audit_events" /tmp/tables.txt
          # D2：诊断域表 + 连接器配置表
          grep -q "investigation_runs" /tmp/tables.txt
          grep -q "run_events" /tmp/tables.txt
          grep -q "evidence" /tmp/tables.txt
          grep -q "hypotheses" /tmp/tables.txt
          grep -q "diagnostic_reports" /tmp/tables.txt
          grep -q "connector_types" /tmp/tables.txt
          grep -q "connector_instances" /tmp/tables.txt
          grep -q "secret_refs" /tmp/tables.txt
          # D3：Capability Registry 表
          grep -q "capability_manifests" /tmp/tables.txt
          grep -q "capability_test_runs" /tmp/tables.txt
          grep -q "asset_observability_bindings" /tmp/tables.txt
          # D4：知识库与 RAG 表 + pgvector 扩展
          grep -q "knowledge_documents" /tmp/tables.txt
          grep -q "knowledge_versions" /tmp/tables.txt
          grep -q "knowledge_chunks" /tmp/tables.txt
          grep -q "knowledge_embeddings" /tmp/tables.txt
          grep -q "retrieval_events" /tmp/tables.txt
          grep -q "runbooks" /tmp/tables.txt
          grep -q "runbook_versions" /tmp/tables.txt
          # D5：审批与受控执行表
          grep -q "proposals" /tmp/tables.txt
          grep -q "approvals" /tmp/tables.txt
          grep -q "action_executions" /tmp/tables.txt
          grep -q "action_idempotency" /tmp/tables.txt
          grep -q "verification_results" /tmp/tables.txt
          psql -h localhost -U opspilot -d opspilot -c "\dx" | grep -q "vector"
          # HNSW 索引按契约存在
          psql -h localhost -U opspilot -d opspilot -c "\di ix_knowledge_embeddings_hnsw" | grep -q "hnsw"
          # D2：langgraph 独立 schema（checkpoint 存储，ADR-5）
          psql -h localhost -U opspilot -d opspilot -c "\dn langgraph" | grep -q "langgraph"

      # 集成测试：conftest 自行重建 opspilot_test 库并执行迁移，
      # DATABASE_URL 由 conftest 注入，无需在此提供
      - name: Run pytest (integration, real PostgreSQL)
        run: uv run pytest -q
